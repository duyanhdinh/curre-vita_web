name: Deployment Curre Vita Web From Github To AWS Beanstalk
on:
  push:
    branches:
      - master
jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
          #Checkout
          - name: Checkout Docker Repo
            uses: actions/checkout@master

          - name: Login to DockerHub
            uses: docker/login-action@master
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Build image ${{ secrets.DOCKERHUB_HUB_REPO }}
            run: |
              docker build . -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_HUB_REPO }}:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_HUB_REPO }}:1.${{ github.run_number }}.0

          - name: Docker push image
            run: |
              docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_HUB_REPO }} --all-tags


